name: Goodreads Calendar Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: state.json
          key: goodreads-state-${{ github.run_id }}
          restore-keys: goodreads-state-
      - name: Restore session cookies
        uses: actions/cache@v4
        with:
          path: goodreads_cookies.pkl
          key: goodreads-cookies
          restore-keys: goodreads-cookies-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sync
        env:
          GOODREADS_EMAIL: ${{ secrets.GOODREADS_EMAIL }}
          GOODREADS_PASSWORD: ${{ secrets.GOODREADS_PASSWORD }}
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
          GOODREADS_SHELF_URL: ${{ secrets.GOODREADS_SHELF_URL }}
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALDAV_URL: ${{ secrets.ICLOUD_CALDAV_URL }}
        run: |
          python main.py
